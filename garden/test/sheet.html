<!doctype html><html><body style="margin:0;background:#43903f">
<canvas id="c" width="400" height="300" style="image-rendering:pixelated;width:1600px;height:1200px"></canvas>
<script type="module">
import * as A from '../src/art.js';
import { CROPS, EGGS, SPRINKLERS } from '../src/data.js';
import { text, bigText } from '../src/font.js';
const g = document.getElementById('c').getContext('2d'); g.imageSmoothingEnabled = false;
g.fillStyle = '#73452f'; g.fillRect(0, 0, 400, 120);
CROPS.forEach((c, i) => { for (let s = 0; s < 6; s++) g.drawImage(A.plantSprite(c.id, s, 1), i * 26 - 8, s * 0 + 0 + (s>2?60:0) , 40, 58); });
CROPS.forEach((c, i) => { for (let s = 0; s < 6; s++) g.drawImage(A.plantSprite(c.id, s, 0), (s) * 40 + (i%2)*0, 0); });
g.clearRect(0,0,400,300); g.fillStyle = '#73452f'; g.fillRect(0, 0, 400, 180);
CROPS.forEach((c, i) => { const col = i % 8, row = Math.floor(i / 8);
  const sp = A.plantSprite(c.id, 5, i); const x = col * 46, y = row * 64;
  g.drawImage(sp, x, y);
  const an = A.ANCHORS[c.id];
  for (const [ax, ay] of an.pts) { const f = A.fruit(c.id, 2); g.drawImage(f, x + A.AX + ax - (f.width>>1), y + A.AY + ay - (an.sit ? f.height : 0)); }
});
let x = 0;
for (let s = 0; s < 5; s++) { g.drawImage(A.plantSprite('apple', s, 2), x, 128); x += 30; }
for (let s = 0; s < 5; s++) { g.drawImage(A.plantSprite('corn', s, 2), x, 128); x += 30; }
CROPS.forEach((c, i) => { g.drawImage(A.packet(c.id), i * 16, 190); g.drawImage(A.cropIcon(c.id), i * 16, 210); });
['gold','rainbow','frozen','shocked','bloodlit','moonlit','chilled','wet','pollinated'].forEach((m, i) => g.drawImage(A.mutated(A.fruit('tomato'), m, 2), 250 + i * 10, 210));
const fr = A.farmerFrames(); fr.right.forEach((f, i) => g.drawImage(f, i * 16, 228));
['seeds','sell','gear','eggs'].forEach((k, i) => g.drawImage(A.npcFrames(k)[0], 70 + i * 16, 228));
['bunny','puppy','chick','kitten','duck','hedgehog','bee','fox','owl','dragonfly','panda','capybara','dragon'].forEach((p, i) => g.drawImage(A.petFrames(p).right[0], 140 + i * 17, 230));
['seeds','sell','gear','eggs'].forEach((k, i) => { const s = A.stallSprites(k); g.drawImage(s.back, 250 + i * 0, 0); });
['seeds','sell','gear','eggs'].forEach((k, i) => { const s = A.stallSprites(k); g.drawImage(s.back, 220 + (i%2) * 48 + 0, 120 + Math.floor(i/2)*0); });
g.fillStyle='#8fd3ff'; g.fillRect(0,250,400,50);
['seeds','sell','gear','eggs'].forEach((k, i) => { const s = A.stallSprites(k); g.drawImage(s.back, i * 48, 246); g.drawImage(A.npcFrames(k)[0], i*48+16, 246+22); g.drawImage(s.front, i * 48, 246); });
g.drawImage(A.cloudSprite(0), 200, 255); g.drawImage(A.cloudSprite(1), 240, 255); g.drawImage(A.cloudSprite(2), 290, 252);
['clear','rain','storm','snow','night','blood'].forEach((w, i) => g.drawImage(A.weatherIcon(w), 200 + i * 12, 285));
EGGS.forEach((e, i) => g.drawImage(A.eggSprite(e.id), 280 + i * 10, 285));
['shovel','can','basket','expand'].forEach((t, i) => g.drawImage(A.toolIcon(t), 330 + i * 15, 284));
Object.keys(SPRINKLERS).forEach((k,i)=> g.drawImage(A.sprinklerIcon(k), 330+i*12, 270));
g.drawImage(A.coinIcon(), 380, 250); g.drawImage(A.treeSprite(1), 360, 140); g.drawImage(A.bush(3), 330, 160);
text(g, 'Grow a Garden! The quick brown fox jumps. $1,234 x5 12.5kg', 2, 182, '#fff6dc', { outline: '#26162b' });
g.drawImage(bigText('Grow a', '#bff07a', '#4fae5a'), 200, 120);
window.done = true;
</script></body></html>
