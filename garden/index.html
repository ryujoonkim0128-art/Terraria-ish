<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d6c3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garden">
<meta name="description" content="Grow a Garden, pocket edition: a cozy pixel-art farming game for your phone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Grow a Garden</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2a22; overscroll-behavior: none; }
  body { display: flex; align-items: flex-start; justify-content: center; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #view { display: block; touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; }
  /* reads the notch / home-bar insets so the HUD can stay clear of them */
  #safe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; }
  noscript { color: #fff6dc; font: 16px/1.4 system-ui, sans-serif; padding: 24px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="safe"></div>
<noscript>Grow a Garden needs JavaScript.</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
