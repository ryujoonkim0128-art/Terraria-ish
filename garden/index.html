<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grow a Garden</title>
<style>
  :root { --bg: #0e1410; --fg: #e8dcc0; --dim: #8a9a78; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(ellipse at center, #16241a 0%, var(--bg) 70%); color: var(--fg); font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace;
         display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; overflow: hidden; }
  #wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  #stage { position: relative; box-shadow: 0 0 0 2px #2a3a2a, 0 12px 40px rgba(0,0,0,0.6); }
  #stage canvas { position: absolute; inset: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  #hud { cursor: crosshair; touch-action: none; }
  #note { color: var(--dim); text-align: center; max-width: 60ch; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="view" width="480" height="270"></canvas><canvas id="hud" width="480" height="270"></canvas></div>
  <p id="note" hidden>Grow a Garden needs a keyboard and mouse.</p>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
