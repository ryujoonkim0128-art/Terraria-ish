<!doctype html>
<html><head><meta charset="utf-8"><title>Scene render</title>
<style>body{margin:0;background:#000}canvas{image-rendering:pixelated}</style></head>
<body><script type="module">
import { SCENES } from './scenes.js';
const v = new URLSearchParams(location.search).get('v') || '1';
const D = SCENES[v]();
document.body.appendChild(D.r.domElement);
D.render();
window.shot = () => {
  const s = +(new URLSearchParams(location.search).get('scale') || 3);
  const c = document.createElement('canvas');
  c.width = D.W * s; c.height = D.H * s;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  x.drawImage(D.r.domElement, 0, 0, c.width, c.height);
  return c.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
